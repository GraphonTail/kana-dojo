plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.kanadojo.ru'
    compileSdk 36

    defaultConfig {
        applicationId 'ua.kanadojo.ru'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            // The key is not in Git: put kanadojo-ru.keystore next to this project
            // (or point KANADOJO_KEYSTORE at it) and set KANADOJO_KEYSTORE_PASSWORD.
            storeFile file(System.getenv('KANADOJO_KEYSTORE') ?: '../kanadojo-ru.keystore')
            storePassword System.getenv('KANADOJO_KEYSTORE_PASSWORD')
            keyAlias 'kanadojo'
            keyPassword System.getenv('KANADOJO_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    androidResources {
        // Keep folders that start with "_" (Next.js puts its scripts in _next/).
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
